<defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter><clipPath id="c"><rect x="2" y="2" width="576" height="226" rx="22"/></clipPath>
<linearGradient id="e" x1="0" x2="1"><stop offset="0" stop-color="#5d80e6"/><stop offset="1" stop-color="#aee2f4"/></linearGradient></defs>
<style>.h{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-weight:700;font-size:28px;fill:#11100f}.d{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-size:16px;fill:#55514b}.t{font-family:'SF Mono','Fira Code',Menlo,Consolas,monospace;font-size:12px;fill:#11100f}
.bd{fill:none;stroke:url(#e);stroke-width:3;stroke-linecap:round;animation:l 6s linear infinite}@keyframes l{to{stroke-dashoffset:-1580}}
