<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 230" width="580" height="230">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1824"/><stop offset="1" stop-color="#0d2a26"/></linearGradient>
<linearGradient id="e" x1="0" x2="1"><stop offset="0" stop-color="#5ff2b0"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient></defs>
<style>
