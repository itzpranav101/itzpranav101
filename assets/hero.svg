<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111c"/><stop offset=".55" stop-color="#0c2230"/><stop offset="1" stop-color="#0d3a2e"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#5ff2b0"/></linearGradient>
<pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#5ff2b0" stroke-opacity=".06"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#5ff2b0" stop-opacity=".35"/><stop offset="1" stop-color="#5ff2b0" stop-opacity="0"/></radialGradient>
<clipPath id="r"><rect width="1200" height="340" rx="22"/></clipPath>
</defs>
<style>
.tr{fill:none;stroke:#5ff2b0;stroke-opacity:.18;stroke-width:2}
.pk{fill:none;stroke:#5ff2b0;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 600;animation:run 4s linear infinite;filter:drop-shadow(0 0 4px #5ff2b0)}
@keyframes run{from{stroke-dashoffset:614}to{stroke-dashoffset:0}}
.name{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;font-size:68px;fill:url(#nm);animation:rise 1.2s ease-out both}
.hi{font-family:'SF Mono','Fira Code',Menlo,Consolas,monospace;font-size:20px;fill:#5ff2b0;animation:rise 1s ease-out both}
.sub{font-family:'SF Mono','Fira Code',Menlo,Consolas,monospace;font-size:24px;fill:#cfe9de}
.s0{animation:cyc 16s 0s infinite;opacity:0}.s1{animation:cyc 16s 4s infinite;opacity:0}.s2{animation:cyc 16s 8s infinite;opacity:0}.s3{animation:cyc 16s 12s infinite;opacity:0}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.ant{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.bot{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.cur{animation:pulse 1s steps(1) infinite}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#g)"/>
<circle cx="1000" cy="170" r="230" fill="url(#glow)"/>
<path d="M0 60 H180 L220 100 H420" class="tr" style="animation-delay:0s"/><path d="M0 60 H180 L220 100 H420" class="pk" style="animation-delay:0s"/><path d="M0 290 H120 L160 250 H360 L400 290 H520" class="tr" style="animation-delay:1.2s"/><path d="M0 290 H120 L160 250 H360 L400 290 H520" class="pk" style="animation-delay:1.2s"/><path d="M1200 70 H1000 L960 110 H820" class="tr" style="animation-delay:0.6s"/><path d="M1200 70 H1000 L960 110 H820" class="pk" style="animation-delay:0.6s"/><path d="M1200 280 H1060 L1020 240 H760" class="tr" style="animation-delay:1.8s"/><path d="M1200 280 H1060 L1020 240 H760" class="pk" style="animation-delay:1.8s"/><path d="M600 0 V30 L640 60 H900" class="tr" style="animation-delay:2.4s"/><path d="M600 0 V30 L640 60 H900" class="pk" style="animation-delay:2.4s"/>
<text x="70" y="96" class="hi">&gt; hello, world <tspan class="cur">▌</tspan></text>
<text x="66" y="172" class="name">Pranav Ramanathan</text>
<text x="70" y="232" class="sub s0">Student developer · Singapore 🇸🇬</text>
<text x="70" y="232" class="sub s1">I build robots that move 🤖</text>
<text x="70" y="232" class="sub s2">…and software that helps people 🧠</text>
<text x="70" y="232" class="sub s3">Currently shipping Meco, LinguaBomb, ROOTED SG</text>

<g transform="translate(930 70)"><g class="bot">
<line x1="100" y1="0" x2="100" y2="34" stroke="#5ff2b0" stroke-width="4"/><circle class="ant" cx="100" cy="-4" r="9" fill="#5ff2b0"/>
<rect x="10" y="34" width="180" height="150" rx="34" fill="#0a1a26" stroke="#5ff2b0" stroke-width="4"/>
<rect x="-6" y="85" width="16" height="44" rx="6" fill="#5ff2b0"/><rect x="190" y="85" width="16" height="44" rx="6" fill="#5ff2b0"/>
<rect class="eye" x="48" y="76" width="30" height="40" rx="12" fill="#5ff2b0"/><rect class="eye" x="122" y="76" width="30" height="40" rx="12" fill="#5ff2b0"/>
<path d="M70 150 Q100 170 130 150" stroke="#5ff2b0" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="60" y="184" width="80" height="22" rx="6" fill="#0a1a26" stroke="#5ff2b0" stroke-width="3"/>
</g></g>
<g class="gear" opacity=".5"><circle cx="1130" cy="290" r="26" fill="none" stroke="#5ff2b0" stroke-width="6" stroke-dasharray="8 6"/><circle cx="1130" cy="290" r="9" fill="#5ff2b0"/></g>
</g></svg>