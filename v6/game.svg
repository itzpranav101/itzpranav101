@keyframes lg{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
.u{animation:u 6s steps(10) infinite}@keyframes u{to{transform:translateY(-300px)}}
.t{animation:u 60s steps(10) infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 3s infinite}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
