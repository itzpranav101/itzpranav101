<g class="h2"><path d="M0 168 q36 -34 72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 V270 H0Z" fill="#d7d0ff"/></g>
<g class="h1"><path d="M0 196 q36 -26 72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 t72 0 V270 H0Z" fill="#a8e6bb"/></g>
<rect y="212" width="290" height="60" fill="#d9d4ca"/><rect y="208" width="290" height="6" fill="#11100f" fill-opacity=".18"/>
<line class="rd" x1="-60" y1="244" x2="400" y2="244" stroke="#fffdf9" stroke-width="5" stroke-dasharray="30 26" stroke-linecap="round"/>
<g class="puff"><circle cx="52" cy="196" r="6" fill="#fffdf9"/></g><g class="puff" style="animation-delay:.5s"><circle cx="52" cy="196" r="6" fill="#fffdf9"/></g><g class="puff" style="animation-delay:1s"><circle cx="52" cy="196" r="6" fill="#fffdf9"/></g>
