<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
<pattern id="dt" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#11100f" fill-opacity=".09"/></pattern>
<clipPath id="r"><rect width="1200" height="340" rx="24"/></clipPath></defs>
<style>
.tr{fill:none;stroke:#5d80e6;stroke-opacity:.22;stroke-width:2}
.pk{fill:none;stroke:#5d80e6;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:12 600;animation:run 4.5s linear infinite}
@keyframes run{from{stroke-dashoffset:612}to{stroke-dashoffset:0}}
.name{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;font-weight:700;font-size:70px;fill:#11100f}
.hi{font-family:'SF Mono','Fira Code',Menlo,Consolas,monospace;font-size:19px;fill:#3f9c5e}
.sub{font-family:'SF Mono','Fira Code',Menlo,Consolas,monospace;font-size:22px;fill:#4a4742}
.s0{animation:cyc 16s 0s infinite;opacity:1}.s1{animation:cyc 16s 4s infinite;opacity:0}.s2{animation:cyc 16s 8s infinite;opacity:0}.s3{animation:cyc 16s 12s infinite;opacity:0}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.b1{animation:d1 14s ease-in-out infinite}.b2{animation:d2 17s ease-in-out infinite}.b3{animation:d1 20s ease-in-out infinite reverse}
@keyframes d1{50%{transform:translate(70px,28px)}}@keyframes d2{50%{transform:translate(-80px,-20px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ant{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
.car{transform-box:fill-box}.body{animation:bob .7s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px) rotate(-.6deg)}}.wh{animation:spin .5s linear infinite}.rd{animation:rdm .55s linear infinite}@keyframes rdm{to{stroke-dashoffset:-56}}.h1{animation:hm 3s linear infinite}.h2{animation:hm 7s linear infinite}@keyframes hm{to{transform:translateX(-144px)}}.cl1{animation:cd 18s linear infinite}.cl2{animation:cd 26s linear infinite}@keyframes cd{from{transform:translateX(-80px)}to{transform:translateX(320px)}}.sun{animation:sn 4s ease-in-out infinite}@keyframes sn{50%{transform:scale(1.08);transform-box:fill-box;transform-origin:center}}.puff{animation:pf 1.5s ease-out infinite;opacity:0}@keyframes pf{from{transform:translate(0,0) scale(.6);opacity:.9}to{transform:translate(-46px,-16px) scale(2);opacity:0}}.beam{animation:bm 1.2s ease-in-out infinite}@keyframes bm{50%{opacity:.15}}.bot{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.cur{animation:pulse 1s steps(1) infinite}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="340" fill="#f7f4ef"/>
<g filter="url(#bl)"><circle class="b1" cx="180" cy="60" r="110" fill="#a8e6bb"/><circle class="b2" cx="560" cy="300" r="120" fill="#aee2f4"/><circle class="b3" cx="1010" cy="120" r="140" fill="#d7d0ff"/><circle class="b2" cx="820" cy="40" r="80" fill="#ffd6a3"/><circle class="b1" cx="1150" cy="320" r="90" fill="#ffe67b" fill-opacity=".8"/></g>
<rect width="1200" height="340" fill="url(#dt)"/>
<path d="M0 60 H180 L220 100 H420" class="tr"/><path d="M0 60 H180 L220 100 H420" class="pk" style="animation-delay:0s"/><path d="M0 292 H120 L160 252 H360 L400 292 H520" class="tr"/><path d="M0 292 H120 L160 252 H360 L400 292 H520" class="pk" style="animation-delay:1.2s"/><path d="M1200 66 H1020 L980 106 H830" class="tr"/><path d="M1200 66 H1020 L980 106 H830" class="pk" style="animation-delay:0.6s"/><path d="M1200 282 H1080 L1040 242 H780" class="tr"/><path d="M1200 282 H1080 L1040 242 H780" class="pk" style="animation-delay:1.8s"/><path d="M610 0 V28 L650 58 H880" class="tr"/><path d="M610 0 V28 L650 58 H880" class="pk" style="animation-delay:2.4s"/>
<text x="70" y="98" class="hi">&gt; hello, world <tspan class="cur">▌</tspan></text>
<text x="66" y="176" class="name">Pranav Ramanathan</text>
<text x="70" y="236" class="sub s0">Student developer · Singapore 🇸🇬</text><text x="70" y="236" class="sub s1">I build robots that move 🤖</text><text x="70" y="236" class="sub s2">…and software that helps people 🧠</text><text x="70" y="236" class="sub s3">Shipping Meco, LinguaBomb and ROOTED SG</text>
<g transform="translate(890 34)">
