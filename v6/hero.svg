<path d="M58 196 q-6 -4 -4 -22 q2 -12 16 -14 l30 -4 q14 -26 44 -26 h26 q22 0 36 26 l22 6 q16 4 16 22 v8 q0 6 -6 6 H64 q-6 0 -6 -6z" fill="#ffd6a3" stroke="#11100f" stroke-width="4" stroke-linejoin="round"/>
<path d="M112 152 q10 -18 32 -18 h22 q16 0 26 18z" fill="#aee2f4" stroke="#11100f" stroke-width="4" stroke-linejoin="round"/>
<line x1="155" y1="134" x2="155" y2="152" stroke="#11100f" stroke-width="4"/>
<rect x="212" y="168" width="14" height="10" rx="5" fill="#ffe67b" stroke="#11100f" stroke-width="3"/><path class="beam" d="M228 173 L275 160 L275 188Z" fill="#ffe67b" fill-opacity=".45"/>
<rect x="60" y="172" width="10" height="9" rx="4" fill="#ff9d8a" stroke="#11100f" stroke-width="3"/>
<path d="M150 184 h16" stroke="#11100f" stroke-width="4" stroke-linecap="round"/>
</g>
<g transform="translate(98 204)"><circle r="19" fill="#11100f"/><g class="wh"><circle r="10" fill="#a8e6bb"/><path d="M0 -10V10M-10 0H10" stroke="#11100f" stroke-width="3"/></g></g>
<g transform="translate(196 204)"><circle r="19" fill="#11100f"/><g class="wh"><circle r="10" fill="#a8e6bb"/><path d="M0 -10V10M-10 0H10" stroke="#11100f" stroke-width="3"/></g></g>
</g>
</g>
<rect width="290" height="272" rx="30" fill="none" stroke="#11100f" stroke-width="4"/>
</g>
</g><rect x="1" y="1" width="1198" height="338" rx="24" fill="none" stroke="#11100f" stroke-opacity=".12" stroke-width="2"/></svg>