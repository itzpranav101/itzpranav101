ransform:rotate(0)}63%{transform:rotate(-112deg)}68%{transform:rotate(-96deg)}73%{transform:rotate(-114deg)}78%{transform:rotate(-96deg)}83%{transform:rotate(-112deg)}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3.5s ease-in-out infinite}@keyframes sw{50%{transform:rotate(5deg)}}.bub{transform-box:fill-box;transform-origin:80% 100%;animation:bb 9s ease-in-out infinite;opacity:0}@keyframes bb{0%,18%{opacity:0;transform:scale(.6)}22%,38%{opacity:1;transform:scale(1)}42%,100%{opacity:0;transform:scale(.6)}}.pt{animation:rs linear infinite;opacity:0}@keyframes rs{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-380px);opacity:0}}.bot{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}
.cur{animation:pulse 1s steps(1) infinite}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
